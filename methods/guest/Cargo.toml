[package]
name = "symbiont-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }
symbiont-core = { path = "../../crates/core" }
serde_json = "1.0.140"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
