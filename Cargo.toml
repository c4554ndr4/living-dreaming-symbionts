[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "methods"]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/c4554ndr4/living-dreaming-symbionts"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
symbiont-core = { path = "crates/core" }
risc0-zkvm = { version = "=3.0.6", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package.risc0-circuit-rv32im]
opt-level = 3

[profile.dev.package.risc0-zkp]
opt-level = 3
